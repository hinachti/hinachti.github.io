<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>הנחתי · פניות</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/site.css">
<style>
  body { padding-bottom: 60px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 26px 0 8px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { border-radius: 12px; }
  .brand h1 { font-family: var(--serif); font-size: 1.7rem; margin: 0; }
  .who { color: var(--faint); font-size: 0.88rem; display: flex; align-items: center; gap: 12px; }
  .concept { margin: 10px 0 22px; padding: 10px 16px; border-radius: 12px; border: 1px dashed var(--dawn-deep);
             color: var(--dawn); background: rgba(224, 169, 74, 0.06); font-size: 0.9rem; }
  .counters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .counter { padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line-soft); background: var(--surface); }
  .counter b { display: block; font-family: var(--serif); font-size: 2rem; color: var(--text); line-height: 1.1; }
  .counter span { color: var(--dim); font-size: 0.88rem; }
  .counter.new b { color: var(--dawn); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .filters button { border: 1px solid var(--line); background: transparent; color: var(--dim); border-radius: 999px;
                    padding: 8px 16px; font: 500 0.9rem var(--sans); cursor: pointer; }
  .filters button[aria-pressed="true"] { border-color: var(--dawn-deep); color: var(--dawn); background: rgba(224, 169, 74, 0.1); }
  .list { display: grid; gap: 10px; }
  .msg { border: 1px solid var(--line-soft); background: var(--surface); border-radius: 16px; overflow: hidden; }
  .msg.unread { border-color: rgba(224, 169, 74, 0.35); }
  .msg > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 14px;
                   align-items: center; padding: 16px 18px; }
  .msg > summary::-webkit-details-marker { display: none; }
  .msg > summary::after { display: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: transparent; }
  .msg.unread .dot { background: var(--dawn); box-shadow: 0 0 10px rgba(224, 169, 74, 0.8); }
  .head { min-width: 0; }
  .subject { font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--faint); font-size: 0.85rem; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
  .tag { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .tag.review { color: var(--dawn); border-color: rgba(224, 169, 74, 0.4); }
  .tag.bug { color: #e98a6f; border-color: rgba(219, 95, 63, 0.45); }
  .tag.idea { color: #a9c97f; border-color: rgba(132, 165, 92, 0.45); }
  .when { color: var(--faint); font-size: 0.84rem; white-space: nowrap; }
  .open { padding: 0 18px 18px 18px; border-top: 1px solid var(--line-soft); }
  .open p { color: var(--text); white-space: pre-wrap; margin: 16px 0; line-height: 1.75; }
  .stars-shown { color: var(--dawn); letter-spacing: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .actions .btn { padding: 11px 22px; font-size: 0.95rem; }
  .actions .btn-ghost { padding: 10px 18px; font-size: 0.92rem; cursor: pointer; }
  .actions .danger:hover { border-color: var(--urgent); color: #e98a6f; }
  .msg.handled .subject { color: var(--dim); }
  .msg.handled .done-label { display: inline; }
  .done-label { display: none; color: var(--done); font-size: 0.82rem; font-weight: 700; }
  .empty { text-align: center; color: var(--faint); padding: 40px 0; }

  /* the sign-in screen: all anyone else ever sees */
  .gate { min-height: 80vh; display: grid; place-items: center; text-align: center; }
  .gate-card { max-width: 420px; padding: 42px 30px; border-radius: 24px; border: 1px solid var(--line-soft); background: var(--surface); }
  .gate-card img { display: block; margin: 0 auto 16px; border-radius: 16px; }
  .gate-card h1 { font-family: var(--serif); margin: 0 0 8px; font-size: 1.8rem; }
  .gate-card p { color: var(--dim); margin: 0 0 24px; }
  .google { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #1f1f1f; border: 0;
            border-radius: 12px; padding: 13px 22px; font: 600 1rem var(--sans); cursor: pointer; }
  .google svg { width: 20px; height: 20px; }
  .tag.src { border-style: dashed; }
  .device-line { color: var(--dim); font-size: 0.88rem; margin: -6px 0 14px; }
  .gate-error { color: #e98a6f !important; margin-top: -10px !important; }
  [hidden] { display: none !important; }
  @media (max-width: 720px) {
    .counters { grid-template-columns: repeat(2, 1fr); }
    .msg > summary { grid-template-columns: auto 1fr; }
    .when { grid-column: 2; }
  }
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <img src="/img/icon-192.png" width="72" height="72" alt="">
    <h1>פניות</h1>
    <p>הדף הזה פתוח רק לחשבון המנהל.</p>
    <p class="gate-error" id="gate-error" hidden>החשבון הזה לא מורשה לצפות בפניות.</p>
    <button class="google" type="button" id="signin">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      כניסה עם Google
    </button>
  </div>
</div>

<div class="wrap" id="panel">
  <div class="top">
    <div class="brand">
      <img src="/img/icon-192.png" width="44" height="44" alt="">
      <h1>פניות</h1>
    </div>
    <div class="who"><span id="who">מחובר כמנהל</span> · <a href="#" id="signout">יציאה</a></div>
  </div>

  <p class="concept" id="sample-note" hidden>תצוגה מקומית: הפניות כאן הן דוגמה מומצאת, כי הפאנל עוד לא מחובר למסד.</p>
  <p class="concept" id="load-error" hidden>לא הצלחנו לטעון את הפניות. נסו לרענן את הדף.</p>

  <div class="counters">
    <div class="counter new"><b id="c-new">0</b><span>חדשות</span></div>
    <div class="counter"><b id="c-all">0</b><span>סך הכל</span></div>
    <div class="counter"><b id="c-rating">–</b><span>דירוג ממוצע</span></div>
    <div class="counter"><b id="c-done">0</b><span>טופלו</span></div>
  </div>

  <div class="filters" id="filters">
    <button type="button" data-f="all" aria-pressed="true">הכל</button>
    <button type="button" data-f="new" aria-pressed="false">חדשות</button>
    <button type="button" data-f="question" aria-pressed="false">שאלות</button>
    <button type="button" data-f="idea" aria-pressed="false">הצעות</button>
    <button type="button" data-f="bug" aria-pressed="false">תקלות</button>
    <button type="button" data-f="review" aria-pressed="false">ביקורות</button>
  </div>

  <div class="list" id="list"></div>
</div>

<script type="module">
// The owner's panel. Firebase Auth proves who is signed in (Google does the
// sign-in, this page never sees a password), and the database rules, not this
// code, decide that only the owner may read: anyone else who signs in gets a
// refusal from Google's servers. Messages arrive live, without a refresh.
//
// The config below is public by design: it names the project, it grants
// nothing. Empty on a local preview, where the panel shows invented examples.
const FIREBASE = {
  apiKey: 'AIzaSyCYvWbIBf4XCXCBYNqdV0S-cTxY2KzIrdw',
  authDomain: 'hinachti-contact.firebaseapp.com',
  projectId: 'hinachti-contact',
  appId: '1:573796670971:web:9ddc01f09d970d7435ff5e'
};
const SDK = 'https://www.gstatic.com/firebasejs/12.3.0/';

const names = { question: 'שאלה', idea: 'הצעה', bug: 'תקלה', review: 'ביקורת' };
const $ = (id) => document.getElementById(id);
const list = $('list');
let messages = [];
let filter = 'all';
const openIds = new Set();
let actions = { read() {}, done() {}, remove() {} };

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const when = (d) => d.toLocaleDateString('he-IL', { day: 'numeric', month: 'short' }) + ' · ' +
                    d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });

function render() {
  const shown = messages.filter((m) => filter === 'all' || (filter === 'new' ? !m.read : m.kind === filter));
  list.innerHTML = shown.length ? '' : '<p class="empty">' + (messages.length ? 'אין פניות כאן.' : 'עוד לא הגיעו פניות.') + '</p>';
  for (const m of shown) {
    const el = document.createElement('details');
    el.className = 'msg' + (m.read ? '' : ' unread') + (m.done ? ' handled' : '');
    el.open = openIds.has(m.id);
    const reply = m.email
      ? '<a class="btn" href="mailto:' + esc(m.email) + '?subject=' + encodeURIComponent('בעניין: ' + m.subject) + '">השב במייל</a>'
      : '<span class="meta">לא הושאר מייל</span>';
    const device = (m.kind === 'bug' || m.kind === 'review') && (m.device || m.appVersion)
      ? '<p class="device-line">' + esc([m.device, m.appVersion && 'גרסה ' + m.appVersion].filter(Boolean).join(' · ')) + '</p>' : '';
    el.innerHTML =
      '<summary><span class="dot"></span><div class="head"><div class="subject">' + esc(m.subject) +
      ' <span class="done-label">· טופל</span></div><div class="meta"><span class="tag ' + m.kind + '">' + names[m.kind] + '</span>' +
      '<span class="tag src">' + (m.source === 'app' ? 'אפליקציה' : 'אתר') + '</span>' +
      (m.stars ? '<span class="stars-shown">' + '★★★★★'.slice(0, m.stars) + '</span>' : '') +
      '<span>' + esc(m.name || 'ללא שם') + '</span>' + (m.email ? '<bdi dir="ltr">' + esc(m.email) + '</bdi>' : '') +
      '</div></div><span class="when">' + when(m.at) + '</span></summary>' +
      '<div class="open"><p>' + esc(m.body) + '</p>' + device + '<div class="actions">' + reply +
      '<button class="btn-ghost" type="button" data-act="done">' + (m.done ? 'החזר לטיפול' : 'סמן כטופל') + '</button>' +
      '<button class="btn-ghost danger" type="button" data-act="delete">מחיקה</button></div></div>';
    el.addEventListener('toggle', () => {
      if (el.open) {
        openIds.add(m.id);
        if (!m.read) { m.read = true; el.classList.remove('unread'); counts(); actions.read(m); }
      } else {
        openIds.delete(m.id);
      }
    });
    el.querySelector('[data-act="done"]').addEventListener('click', () => { m.done = !m.done; actions.done(m); render(); });
    el.querySelector('[data-act="delete"]').addEventListener('click', () => {
      if (confirm('למחוק את הפנייה לצמיתות?')) { messages = messages.filter((x) => x !== m); actions.remove(m); render(); }
    });
    list.appendChild(el);
  }
  counts();
}

function counts() {
  const fresh = messages.filter((m) => !m.read).length;
  $('c-new').textContent = fresh;
  $('c-all').textContent = messages.length;
  $('c-done').textContent = messages.filter((m) => m.done).length;
  const rated = messages.filter((m) => m.stars);
  $('c-rating').textContent = rated.length ? (rated.reduce((a, m) => a + m.stars, 0) / rated.length).toFixed(1) + '★' : '–';
  // the tab says how many are waiting, so a glance at the browser is enough
  document.title = (fresh ? '(' + fresh + ') ' : '') + 'הנחתי · פניות';
}

for (const b of document.querySelectorAll('#filters button')) {
  b.addEventListener('click', () => {
    filter = b.dataset.f;
    for (const o of document.querySelectorAll('#filters button')) o.setAttribute('aria-pressed', String(o === b));
    render();
  });
}

const showPanel = (yes) => { $('panel').hidden = !yes; $('gate').hidden = yes; };

if (!FIREBASE.projectId) {
  // Local preview only: invented people, example.com addresses.
  $('sample-note').hidden = false;
  const t = (s) => new Date(s);
  messages = [
    { id: '1', kind: 'review', stars: 5, name: 'דוד ל.', email: 'david@example.com', subject: 'פשוט עובד', source: 'app',
      body: 'מניח כל בוקר כבר שלושה שבועות ברצף. התזכורת בדיוק בזמן, ואין שום דבר מיותר. תודה!', at: t('2026-09-28T07:42'), read: false, done: false },
    { id: '2', kind: 'bug', name: 'משה', email: 'moshe@example.com', subject: 'הזמנים בעיר שלי', source: 'app', device: 'Samsung SM-S911B', appVersion: '1.8.0',
      body: 'בחרתי את העיר שלי והשקיעה מופיעה דקה אחרי מה שכתוב בלוח של בית הכנסת. אולי כדאי לבדוק?', at: t('2026-09-27T21:10'), read: false, done: false },
    { id: '3', kind: 'idea', name: '', email: '', subject: 'קריאת שמע שעל המיטה', source: 'web',
      body: 'יהיה נהדר אם תוסיפו גם את קריאת שמע שעל המיטה, בנוסח ספרד.', at: t('2026-09-27T12:03'), read: true, done: false },
    { id: '4', kind: 'question', name: 'יוסי ב.', email: 'yossi@example.com', subject: 'האם יש גרסה לאייפון?', source: 'web',
      body: 'אשתי ביקשה לדעת אם יש תוכניות לאייפון.', at: t('2026-09-26T18:25'), read: true, done: true },
    { id: '5', kind: 'review', stars: 4, name: 'אבי', email: '', subject: 'יפה מאוד', source: 'web',
      body: 'אפליקציה מעולה. הייתי שמח לאפשרות לשנות את צליל התזכורת.', at: t('2026-09-25T08:15'), read: true, done: false }
  ];
  $('signout').addEventListener('click', (e) => { e.preventDefault(); showPanel(false); });
  $('signin').addEventListener('click', () => showPanel(true));
  showPanel(true);
  render();
} else {
  const [{ initializeApp }, auth, fs] = await Promise.all([
    import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')
  ]);
  const app = initializeApp(FIREBASE);
  const a = auth.getAuth(app);
  const db = fs.getFirestore(app);
  let stop = null;

  actions = {
    read: (m) => fs.updateDoc(fs.doc(db, 'messages', m.id), { read: true }).catch(console.error),
    done: (m) => fs.updateDoc(fs.doc(db, 'messages', m.id), { done: m.done }).catch(console.error),
    remove: (m) => fs.deleteDoc(fs.doc(db, 'messages', m.id)).catch(console.error)
  };

  $('signin').addEventListener('click', () => {
    $('gate-error').hidden = true;
    auth.signInWithPopup(a, new auth.GoogleAuthProvider()).catch((e) => {
      if (e.code !== 'auth/popup-closed-by-user') console.error(e);
    });
  });
  $('signout').addEventListener('click', (e) => { e.preventDefault(); auth.signOut(a); });

  auth.onAuthStateChanged(a, (user) => {
    if (stop) { stop(); stop = null; }
    if (!user) { showPanel(false); return; }
    $('who').textContent = user.displayName || 'מחובר';
    const q = fs.query(fs.collection(db, 'messages'), fs.orderBy('createdAt', 'desc'));
    stop = fs.onSnapshot(q, (snap) => {
      showPanel(true);
      $('load-error').hidden = true;
      messages = snap.docs.map((d) => {
        const v = d.data();
        return { id: d.id, ...v, at: v.createdAt ? v.createdAt.toDate() : new Date(), stars: Number(v.stars) || 0 };
      });
      render();
    }, (err) => {
      if (err.code === 'permission-denied') {
        // signed in, but not as the owner: the database said no
        showPanel(false);
        $('gate-error').hidden = false;
        auth.signOut(a);
      } else {
        console.error(err);
        showPanel(true);
        $('load-error').hidden = false;
      }
    });
  });
}
</script>
</body>
</html>
